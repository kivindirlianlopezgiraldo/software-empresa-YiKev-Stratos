<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="División de baño en vidrio templado">
  <defs>
    <linearGradient id="fondoBano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a26"/>
      <stop offset="100%" stop-color="#0f2e3c"/>
    </linearGradient>
    <linearGradient id="azulejo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="vidrioTemplado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="reflejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mosaico" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none" stroke="#67e8f9" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#fondoBano)"/>
  <rect width="1200" height="800" fill="url(#mosaico)"/>

  <rect x="0" y="620" width="1200" height="180" fill="#0b2230"/>
  <rect x="0" y="620" width="1200" height="8" fill="#22d3ee" opacity="0.35"/>

  <rect x="760" y="170" width="320" height="500" rx="8" fill="url(#azulejo)" stroke="#155e75" stroke-width="2"/>
  <circle cx="920" cy="280" r="64" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="920" cy="280" r="40" fill="#0b1220" stroke="#67e8f9" stroke-opacity="0.2" stroke-width="3"/>
  <rect x="980" y="365" width="52" height="14" rx="7" fill="#a5f3fc" opacity="0.6"/>

  <rect x="250" y="150" width="500" height="510" rx="6" fill="url(#vidrioTemplado)" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="3"/>
  <rect x="500" y="150" width="250" height="510" fill="url(#vidrioTemplado)" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2"/>

  <path d="M 280 180 L 470 180 L 280 440 Z" fill="url(#reflejo)" opacity="0.55"/>
  <path d="M 530 380 L 720 380 L 530 560 Z" fill="url(#reflejo)" opacity="0.35"/>

  <rect x="246" y="146" width="510" height="16" rx="6" fill="url(#acero)"/>
  <rect x="246" y="648" width="510" height="14" rx="5" fill="url(#acero)"/>
  <rect x="486" y="160" width="12" height="490" rx="4" fill="url(#acero)"/>

  <rect x="672" y="360" width="18" height="70" rx="9" fill="url(#acero)"/>
  <rect x="700" y="380" width="10" height="10" rx="5" fill="#e2e8f0"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="70" fill="#67e8f9" font-size="20" font-weight="700" letter-spacing="5">YIKEV STRATOS · PORTAFOLIO</text>
    <text x="1110" y="70" fill="#94a3b8" font-size="16" text-anchor="end" letter-spacing="3">VIDRIO TEMPLADO 8 MM</text>
    <text x="90" y="736" fill="#e2e8f0" font-size="30" font-weight="800">Suite 402 · Hotel Camino Real</text>
    <text x="90" y="770" fill="#67e8f9" font-size="17" letter-spacing="2">DIVISIÓN DE BAÑO · HERRAJES EN ACERO INOXIDABLE</text>
  </g>
</svg>
