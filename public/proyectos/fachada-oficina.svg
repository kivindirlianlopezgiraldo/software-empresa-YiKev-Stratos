<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Fachada flotante en vidrio para oficinas">
  <defs>
    <linearGradient id="cieloFachada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#102a46"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="perfil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="trama" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#bfdbfe" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#cieloFachada)"/>
  <rect width="1200" height="800" fill="url(#trama)"/>

  <path d="M 0 660 L 1200 660 L 1200 800 L 0 800 Z" fill="#050d18"/>
  <path d="M 0 660 L 1200 660" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="3"/>

  <rect x="150" y="110" width="900" height="550" fill="#0b1c30" stroke="#1e40af" stroke-width="3"/>

  <g stroke="url(#perfil)" stroke-width="10">
    <line x1="150" y1="110" x2="1050" y2="110"/>
    <line x1="150" y1="110" x2="150" y2="660"/>
    <line x1="1050" y1="110" x2="1050" y2="660"/>
    <line x1="150" y1="660" x2="1050" y2="660"/>
    <line x1="450" y1="110" x2="450" y2="660"/>
    <line x1="750" y1="110" x2="750" y2="660"/>
    <line x1="150" y1="300" x2="1050" y2="300"/>
    <line x1="150" y1="480" x2="1050" y2="480"/>
  </g>

  <g fill="url(#panel)">
    <rect x="165" y="125" width="270" height="160"/>
    <rect x="465" y="125" width="270" height="160"/>
    <rect x="765" y="125" width="270" height="160"/>
    <rect x="165" y="315" width="270" height="150"/>
    <rect x="465" y="315" width="270" height="150"/>
    <rect x="765" y="315" width="270" height="150"/>
    <rect x="165" y="495" width="270" height="150"/>
    <rect x="465" y="495" width="270" height="150"/>
    <rect x="765" y="495" width="270" height="150"/>
  </g>

  <path d="M 180 140 L 400 140 L 180 390 Z" fill="url(#luz)" opacity="0.5"/>
  <path d="M 480 330 L 700 330 L 480 560 Z" fill="url(#luz)" opacity="0.28"/>
  <path d="M 780 150 L 1000 150 L 780 380 Z" fill="url(#luz)" opacity="0.22"/>

  <rect x="690" y="560" width="130" height="100" fill="#0a1626" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="3"/>
  <line x1="755" y1="560" x2="755" y2="660" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="120" y="66" fill="#93c5fd" font-size="20" font-weight="700" letter-spacing="5">YIKEV STRATOS · PORTAFOLIO</text>
    <text x="1080" y="66" fill="#94a3b8" font-size="16" text-anchor="end" letter-spacing="3">MURO CORTINA</text>
    <text x="120" y="736" fill="#e2e8f0" font-size="30" font-weight="800">Fundación Chocó · Sede administrativa</text>
    <text x="120" y="770" fill="#93c5fd" font-size="17" letter-spacing="2">FACHADA FLOTANTE · 6 PAÑOS FIJOS EN VIDRIO</text>
  </g>
</svg>
