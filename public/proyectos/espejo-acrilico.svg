<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Espejo panorámico y letrero en acrílico">
  <defs>
    <linearGradient id="fondoEspejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="espejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#64748b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="acrilico" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="brilloEspejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="resplandor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#fondoEspejo)"/>
  <rect x="0" y="640" width="1200" height="160" fill="#050b14"/>
  <rect x="0" y="640" width="1200" height="3" fill="#38bdf8" opacity="0.35"/>

  <rect x="150" y="120" width="720" height="440" rx="8" fill="url(#espejo)" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="5"/>
  <rect x="168" y="138" width="684" height="404" fill="none" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="2"/>

  <path d="M 190 160 L 500 160 L 190 480 Z" fill="url(#brilloEspejo)" opacity="0.7"/>
  <path d="M 580 300 L 820 300 L 580 520 Z" fill="url(#brilloEspejo)" opacity="0.3"/>
  <ellipse cx="450" cy="470" rx="210" ry="30" fill="#0f172a" opacity="0.35"/>

  <rect x="930" y="250" width="170" height="240" rx="18" fill="#0b1220" stroke="url(#acrilico)" stroke-width="6" filter="url(#resplandor)"/>
  <text x="1015" y="335" fill="#e0f2fe" font-size="54" font-weight="900" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Y</text>
  <text x="1015" y="378" fill="#67e8f9" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="4" font-family="ui-sans-serif, system-ui, sans-serif">STRATOS</text>
  <path d="M 965 405 L 1065 405" stroke="url(#acrilico)" stroke-width="3"/>

  <circle cx="230" cy="520" r="14" fill="#38bdf8" opacity="0.45"/>
  <circle cx="800" cy="160" r="8" fill="#a5f3fc" opacity="0.6"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="110" y="70" fill="#67e8f9" font-size="20" font-weight="700" letter-spacing="5">YIKEV STRATOS · PORTAFOLIO</text>
    <text x="1090" y="70" fill="#94a3b8" font-size="16" text-anchor="end" letter-spacing="3">ESPEJO Y ACRÍLICO</text>
    <text x="110" y="732" fill="#e2e8f0" font-size="30" font-weight="800">Almacén La 14</text>
    <text x="110" y="766" fill="#67e8f9" font-size="17" letter-spacing="2">ESPEJO PANORÁMICO 1.80 × 0.90 M · MARCO A MEDIDA</text>
  </g>
</svg>
